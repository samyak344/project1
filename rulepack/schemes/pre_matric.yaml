scheme: pre_matric
state: haryana
rules:
  - id: pre_matric_001
    description: "Pre-Matric Sch. eligibility."
    when:
      - field: is_student
        op: eq
        value: true
      - field: class_lte
        op: eq
        value: 10
    outcome: include
    documents: ['aadhaar', 'income_cert']
    desk: education_dept
    source: {doc: "Pre-Matric Sch. Guidelines", clause: "Eligibility", url: "https://india.gov.in/"}
    verified_on: 2026-10-09
    verified_by: [System, Auto-Verifier]
    expires_on: 2027-10-09
    test_vectors:
      - input: {}
        expect: needs_official_decision
